<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">Il nuovo mondo di Yume 3.0</title>
<desc id="desc">Tre portali magici illuminano un paesaggio giapponese notturno: l'universo degli anime, una biblioteca manga e il viaggio in Giappone.</desc>
