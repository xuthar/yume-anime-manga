<radialGradient id="cosmic"><stop stop-color="#B472EE" stop-opacity=".72"/><stop offset=".50" stop-color="#386DE3" stop-opacity=".30"/><stop offset="1" stop-color="#1B214B" stop-opacity="0"/></radialGradient>
<radialGradient id="moon"><stop stop-color="#FFECFD"/><stop offset=".6" stop-color="#C8E8FA"/><stop offset="1" stop-color="#90D6F0"/></radialGradient>
