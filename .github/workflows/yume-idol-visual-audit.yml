name: Yume Idols visual photo audit
on:
  workflow_dispatch:
    inputs:
      categories:
        description: "Comma-separated Yume categories"
        required: false
        default: "vtuber,music,cosplay,fashion,gravure"
      max_cards:
        description: "Maximum cards per category in this batch (up to 5000)"
        required: false
        default: "96"
      offset:
        description: "Start after this many entries in each category"
        required: false
        default: "0"
permissions:
  contents: write
concurrency:
  group: yume-visual-photo-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Inspect image rendering and capture review screenshots
        env:
          AUDIT_CATEGORIES: ${{ github.event.inputs.categories || 'vtuber,music,cosplay,fashion,gravure' }}
          AUDIT_MAX_CARDS: ${{ github.event.inputs.max_cards || '96' }}
          AUDIT_OFFSET: ${{ github.event.inputs.offset || '0' }}
          AUDIT_SCREENSHOTS: "16"
        run: node scripts/yume-idol-gallery-audit.cjs
      - name: Recover source-verified Commons portraits for missing cards
        env:
          RECOVER_LIMIT: "220"
        run: node scripts/yume-recover-missing-portraits.cjs
      - name: Verify restored images in Chromium
        env:
          AUDIT_CATEGORIES: "music,fashion,cosplay,creators,gravure"
          AUDIT_MAX_CARDS: "96"
          AUDIT_OFFSET: "0"
          AUDIT_SCREENSHOTS: "5"
          AUDIT_OUTPUT: "artifacts/yume-idol-photo-audit-after"
        run: node scripts/yume-idol-gallery-audit.cjs
      - name: Publish new image references to Yume
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yume-recovered-portraits.json
          if ! git diff --cached --quiet; then
            git commit -m "Add verified Commons portraits to Yume image index"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save screenshot and error report for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yume-idols-photo-audit-${{ github.run_number }}
          path: |
            artifacts/yume-idol-photo-audit/
            artifacts/yume-idol-photo-audit-after/
            data/yume-recovered-portraits.json
          if-no-files-found: warn
          retention-days: 14
