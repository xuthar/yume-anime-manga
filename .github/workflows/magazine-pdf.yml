name: Genera e pubblica i PDF di Yume Magazine
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-magazine-pdf.py'
      - 'data/magazine/**'
      - '.github/workflows/magazine-pdf.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: yume-magazine-pdf
  cancel-in-progress: false
jobs:
  create-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa ReportLab
        run: python -m pip install 'reportlab>=4.2,<5'
      - name: Genera i numeri disponibili
        run: python scripts/build-magazine-pdf.py
      - name: Verifica i PDF illustrati
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/yume-magazine-numero-00.pdf')
          if not p.exists() or p.stat().st_size < 15000:
              raise SystemExit('PDF assente o troppo piccolo')
          assert p.read_bytes()[:5] == b'%PDF-', 'Firma PDF non valida'
          print('PDF pronto', p, p.stat().st_size, 'bytes')
          PY
      - name: Registra i PDF e il catalogo degli abbonamenti
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/yume-magazine-numero-*.pdf data/magazine/pdf-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Pubblica PDF illustrati di Yume Magazine'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepara il sito completo per Pages
        run: |
          mkdir -p _site
          cp *.html *.css *.js *.json favicon.svg robots.txt sitemap.xml _site/
          cp -r assets data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: create-pdfs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica il sito e la collezione PDF
        id: deployment
        uses: actions/deploy-pages@v4
