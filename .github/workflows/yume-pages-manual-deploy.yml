name: Yume · deploy static website
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Yume verified portrait index"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "idols-discovery-data.js"
      - "idols-discovery-category.js"
      - "scripts/yume-photo-harvest.cjs"
      - "data/yume-photo-index.json"
      - "data/yume-photo-report.json"
      - ".github/workflows/yume-pages-manual-deploy.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Publish latest Yume website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
