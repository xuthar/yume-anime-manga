name: Yume verified portrait index
on:
  push:
    branches: [main]
    paths:
      - "scripts/yume-photo-harvest.cjs"
      - "scripts/yume-idol-photo-audit.cjs"
      - "sport-idols-data.js"
      - "asia-idols-data.js"
      - "idols-discovery-data.js"
      - ".github/workflows/yume-photo-index.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: write
concurrency:
  group: yume-photo-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh checkout to current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Recover verified Wikimedia portraits
        run: node scripts/yume-photo-harvest.cjs
      - name: Audit photo licenses, authors and live image URLs
        run: node scripts/yume-idol-photo-audit.cjs --write --check-images
      - name: Publish updated photo index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yume-photo-index.json data/yume-photo-report.json data/yume-idols-photo-audit-*.json
          if git diff --cached --quiet; then
            echo "Photo index already current"
          else
            git commit -m "Refresh verified Yume idols and athlete photo index"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
