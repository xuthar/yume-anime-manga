name: Aggiorna calendario episodi
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/episode-calendar.yml'
      - 'scripts/update-episode-calendar.py'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: yume-calendar
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'lxml>=5,<7'
      - run: python scripts/update-episode-calendar.py
      - name: Salva calendario aggiornato
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/episode-calendar.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna calendario italiano degli episodi'
            git push
          fi
      # A commit made with GITHUB_TOKEN does not trigger a Pages branch build.
      # Deploy the refreshed site explicitly instead.
      - uses: actions/configure-pages@v5
      - name: Prepara sito pubblico
        run: |
          mkdir _site
          cp *.html *.css *.js *.json favicon.svg robots.txt sitemap.xml _site/
          cp -r assets data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica calendario e sito
        id: deployment
        uses: actions/deploy-pages@v4
